# nginx-Konfiguration für hufiapp.de
# Zielserver: XXL (85.190.105.104) | administrator@cloud-server-10634828
# Ablegen: /etc/nginx/sites-available/hufiapp
# Aktivieren: ln -sf /etc/nginx/sites-available/hufiapp /etc/nginx/sites-enabled/hufiapp
# Prüfen:     nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name hufiapp.de www.hufiapp.de;

    # HTTP → HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hufiapp.de www.hufiapp.de;

    # Build-Output des Vite-Builds
    # Auf XXL: dist-Ordner nach einem dieser Pfade kopieren/symlinken
    # z.B.: /srv/hufi/hufiapp/dist  oder  /var/www/hufiapp/dist
    root /srv/hufi/hufiapp/dist;
    index index.html;

    # SSL – Let's Encrypt (certbot auto)
    ssl_certificate     /etc/letsencrypt/live/hufiapp.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hufiapp.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache: gehashte Vite-Assets (unveränderlich, 1 Jahr)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache: Icons, Bilder
    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Service Worker – niemals cachen
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA-Fallback: alle Routes → index.html (React Router BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
